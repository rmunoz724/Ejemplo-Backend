<!DOCTYPE html>
<html lang="es">
    <head>
        <title>
            Formulario de ingreso de persona
        </title>
    </head>
    <body>
        <h1>Formulario Ingreso de datos de Persona</h1>
        <form action="{% url 'FormularioPersona' %}" method="post">
            {% csrf_token %}
            {{form.as_p }}

            <button type="submit">Ingresar Datos</button>
            <button type="reset">Limpiar Formulario</button>
        </form>
    </body>
</html>
